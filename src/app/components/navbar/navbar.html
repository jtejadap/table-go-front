<!-- ============ HEADER ============ -->
<header
  class="fixed inset-x-0 top-0 z-40 m-3 transition-[padding] duration-300 lg:m-4"
  [class]="toggled() ? 'lg:pl-[114px]' : 'lg:pl-[340px]'"
>
  <div
    class="flex h-14 w-full items-center justify-between rounded-2xl bg-white px-4 shadow-[0_2px_24px_rgba(0,0,0,0.1)] transition-colors dark:bg-slate-900 dark:shadow-[0_2px_24px_rgba(255,255,255,0.08)] sm:px-6 lg:h-22 lg:px-8"
  >
    <a [routerLink]="homeRoute()" class="inline-flex items-center gap-x-1 lg:order-1">
      <i class="ri-cloud-fill text-2xl text-[#243B55] dark:text-white" aria-hidden="true"></i>
      <span class="font-semibold text-slate-800 dark:text-slate-100">{{ brand() }}</span>
    </a>

    <button
      type="button"
      class="cursor-pointer text-2xl text-slate-800 dark:text-slate-100"
      aria-controls="sidebar"
      aria-label="Abrir o cerrar el menú"
      [attr.aria-expanded]="toggled()"
      (click)="toggleSidebar()"
    >
      <i [class]="toggled() ? 'ri-close-line' : 'ri-menu-line'" aria-hidden="true"></i>
    </button>
  </div>
</header>

<!-- Fondo oscuro: solo móvil/tablet con el menú abierto -->
@if (toggled()) {
  <div class="fixed inset-0 z-30 bg-black/45 lg:hidden" (click)="toggled.set(false)"></div>
}

<!-- ============ SIDEBAR ============ -->
<nav
  id="sidebar"
  aria-label="Navegación principal"
  class="group fixed inset-y-0 z-40 m-3 w-72 max-w-[calc(100vw-1.5rem)] overflow-hidden rounded-2xl bg-white py-6 shadow-[2px_0_24px_rgba(0,0,0,0.1)] transition-[left,width] duration-300 max-[360px]:w-max dark:bg-slate-900 dark:shadow-[2px_0_24px_rgba(255,255,255,0.08)] lg:left-0 lg:m-4"
  [class]="toggled() ? 'left-0 lg:w-[90px]' : '-left-[120%] lg:w-[316px]'"
  [attr.data-collapsed]="toggled()"
>
  <div class="flex h-full flex-col gap-y-12 overflow-hidden">
    <!-- Usuario -->
    <div
      class="grid grid-cols-[repeat(2,max-content)] items-center gap-x-4 pl-8 transition-[padding] max-[360px]:grid-cols-[max-content] max-[360px]:justify-center max-[360px]:pl-0 lg:group-data-[collapsed=true]:pl-5"
    >
      <div
        class="relative grid size-[50px] justify-items-center overflow-hidden rounded-full bg-[#243B55] dark:bg-white"
      >
        <img [src]="avatar()" alt="Foto de perfil" class="absolute -bottom-px w-9" />
      </div>

      <div
        class="transition-opacity max-[360px]:hidden lg:group-data-[collapsed=true]:opacity-0"
      >
        <h3 class="text-base text-slate-800 dark:text-slate-100">{{ user()?.nombre }}</h3>
        <span class="text-xs text-slate-500 dark:text-slate-400">{{ user()?.email }}</span>
      </div>
    </div>

    <!-- Enlaces por rol -->
    <div
      class="flex flex-col gap-y-12 overflow-x-hidden overflow-y-auto [scrollbar-width:thin]"
    >
      @for (section of sections(); track section.title) {
        <div>
          <h3
            class="mb-6 w-max pl-8 text-xs font-semibold text-slate-500 max-[360px]:mx-auto max-[360px]:px-2 lg:group-data-[collapsed=true]:mx-auto lg:group-data-[collapsed=true]:pl-0 dark:text-slate-400"
          >
            {{ section.title }}
          </h3>

          <div class="grid gap-y-6">
            @for (item of section.items; track item.route) {
              <a
                [class]="linkClass"
                [routerLink]="item.route"
                routerLinkActive=""
                ariaCurrentWhenActive="page"
                [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
                (click)="onNavigate()"
              >
                <i [class]="item.icon" class="text-xl" aria-hidden="true"></i>
                <span
                  class="font-semibold transition-opacity max-[360px]:hidden lg:group-data-[collapsed=true]:opacity-0"
                  >{{ item.label }}</span
                >
              </a>
            }
          </div>
        </div>
      }
    </div>

    <!-- Acciones -->
    <div class="mt-auto grid gap-y-6">
      <button type="button" [class]="linkClass" (click)="toggleTheme()">
        <i [class]="isDark() ? 'ri-sun-fill' : 'ri-moon-clear-fill'" class="text-xl" aria-hidden="true"></i>
        <span
          class="font-semibold transition-opacity max-[360px]:hidden lg:group-data-[collapsed=true]:opacity-0"
          >Tema</span
        >
      </button>

      <button type="button" [class]="linkClass" (click)="logout()">
        <i class="ri-logout-box-r-fill text-xl" aria-hidden="true"></i>
        <span
          class="font-semibold transition-opacity max-[360px]:hidden lg:group-data-[collapsed=true]:opacity-0"
          >Salir</span
        >
      </button>
    </div>
  </div>
</nav>
